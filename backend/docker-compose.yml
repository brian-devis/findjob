name: ai-job-assistant

services:
  backend:
    build: .
    container_name: ai-job-assistant-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/aijob.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请在 .env 中配置至少 32 字符的随机强密钥}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - aijob-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "512M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aijob-data:
